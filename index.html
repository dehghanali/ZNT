<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام کارت مترو</title>
    <!-- اسکریپت رسمی تلگرام برای ارتباط Mini App با تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>استعلام موجودی کارت با NFC</h2>
    <p>کارت خود را پشت گوشی نگه دارید و روی دکمه زیر بزنید:</p>
    
    <button id="readNfcBtn">اسکن کارت</button>
    <p id="result" style="margin-top: 20px; font-weight: bold;"></p>

    <script>
        // فعال‌سازی وب اپ تلگرام
        let tg = window.Telegram.WebApp;
        tg.expand(); // باز شدن صفحه به صورت تمام‌صفحه

        document.getElementById('readNfcBtn').addEventListener('click', async () => {
            const resultElement = document.getElementById('result');
            
            // بررسی پشتیبانی مرورگر/گوشی از Web NFC
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    resultElement.innerText = "لطفاً کارت را به گوشی نزدیک کنید...";
                    
                    ndef.onreading = event => {
                        const serialNumber = event.serialNumber;
                        resultElement.innerText = `شماره سریال کارت: ${serialNumber}`;
                        
                        // اینجا می‌توانید اطلاعات را به بات تلگرام یا سرور خودتان ارسال کنید
                    };
                } catch (error) {
                    resultElement.innerText = `خطا: ${error}`;
                }
            } else {
                resultElement.innerText = "مرورگر شما یا نسخه تلگرام از NFC پشتیبانی نمی‌کند.";
            }
        });
    </script>
</body>
</html>
